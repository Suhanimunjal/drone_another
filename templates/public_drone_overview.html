<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Overview — Forensics Dashboard</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="stylesheet" href="/static/drone_record_view.css">
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid #21262d;
      background: #161b22;
    }
    .top-bar a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 13px;
    }
    .top-bar a:hover { text-decoration: underline; }
    .content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }
    .create-case-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-top: 24px;
    }
    .create-case-section p {
      margin: 0 0 16px 0;
      color: #8b949e;
      font-size: 14px;
    }
    .btn-primary {
      background: #238636;
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      color: #f85149;
      font-size: 13px;
      margin-top: 12px;
    }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #8b949e;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state {
      text-align: center;
      padding: 48px 0;
      color: #8b949e;
    }
    .not-found {
      text-align: center;
      padding: 48px 0;
      color: #f85149;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/search">&larr; Back to search</a>
    <div id="top-right"></div>
  </div>

  <div class="content">
    <div id="loading-state" class="loading-state">
      <div class="loader"></div>
      Loading drone data...
    </div>
    <div id="not-found" class="not-found" style="display:none;">
      Drone not found.
    </div>
    <div id="drone-content" style="display:none;">
      <div id="drone-detail-container"></div>
      <div class="create-case-section">
        <p>Investigating this drone? Create a case to begin analysis.</p>
        <button id="create-case-btn" class="btn-primary">Create case</button>
        <div id="create-case-error" class="error-msg" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="/static/attribute_categorizer.js"></script>
  <script src="/static/drone_record_view.js"></script>
  <script src="/static/public_drone_overview.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Overview — Drone Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="stylesheet" href="/static/drone_record_view.css">
  <style>
    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13.5px;
      margin-left: auto;
    }
    .back-link:hover { color: var(--text); text-decoration: none; }

    /* ── Content ── */
    .content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Loading state ── */
    .loading-state {
      text-align: center;
      padding: 80px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .loading-state .loader {
      display: block;
      margin: 0 auto 16px;
      width: 28px; height: 28px;
      border-width: 3px;
    }

    /* ── Not found ── */
    .not-found {
      text-align: center;
      padding: 80px 0;
    }
    .not-found .nf-icon {
      font-family: var(--font-mono);
      font-size: 48px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .not-found h2 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .not-found p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ── Create case section ── */
    .create-case-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      margin-top: 28px;
    }
    .create-case-section p {
      margin: 0 0 16px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .error-msg {
      color: var(--status-danger);
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">DR</div>
      <div>
        <div class="brand-name">Drone Registry</div>
        <div class="brand-sub">Public lookup</div>
      </div>
    </div>
    <a href="/search" class="back-link">&larr; Back to search</a>
    <div id="top-right"></div>
  </header>

  <div class="content">
    <div id="loading-state" class="loading-state">
      <div class="loader"></div>
      Loading drone data...
    </div>
    <div id="not-found" class="not-found" style="display:none;">
      <div class="nf-icon">?</div>
      <h2>Drone not found</h2>
      <p>The requested drone record could not be located in the registry.</p>
      <a href="/search" class="btn-ghost" style="display:inline-flex;">&larr; Back to search</a>
    </div>
    <div id="drone-content" style="display:none;">
      <div id="drone-detail-container"></div>
      <div class="create-case-section">
        <p>Investigating this drone? Create a case to begin analysis.</p>
        <button id="create-case-btn" class="btn-primary">Create case</button>
        <div id="create-case-error" class="error-msg" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="/static/attribute_categorizer.js"></script>
  <script src="/static/drone_record_view.js"></script>
  <script src="/static/public_drone_overview.js"></script>
</body>
</html>

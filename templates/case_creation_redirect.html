<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating case — Drone Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .status-box {
      text-align: center;
    }
    .status-box .loader {
      display: block;
      margin: 0 auto 20px;
      width: 32px;
      height: 32px;
      border-width: 3px;
    }
    .status-box p {
      color: var(--text-secondary);
      font-size: 14px;
      margin: 0;
    }
    .brand {
      justify-content: center;
      margin-bottom: 40px;
    }
    .error-msg {
      color: var(--status-danger);
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div>
    <div class="brand">
      <div class="brand-mark">DR</div>
      <div>
        <div class="brand-name">Drone Registry</div>
        <div class="brand-sub">Case creation</div>
      </div>
    </div>
    <div class="status-box">
      <div class="loader"></div>
      <p>Creating case from drone #{{ drone_id }}...</p>
      <div id="error" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <script>
    (function () {
      var droneId = {{ drone_id | int }};

      fetch("/api/cases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ drone_id: droneId }),
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.case_id) {
            window.location.replace("/cases/" + data.case_id);
          } else {
            document.getElementById("error").textContent =
              data.error || "Failed to create case.";
            document.getElementById("error").style.display = "block";
          }
        })
        .catch(function () {
          document.getElementById("error").textContent =
            "Network error. Please try again.";
          document.getElementById("error").style.display = "block";
        });
    })();
  </script>
</body>
</html>

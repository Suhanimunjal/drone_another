<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Drone Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 360px;
      max-width: 100%;
    }
    .brand {
      justify-content: center;
      margin-bottom: 32px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus { border-color: var(--accent-teal); }
    .error-msg {
      background: var(--status-danger-dim);
      border: 1px solid var(--status-danger);
      color: var(--status-danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
    }
    .login-submit {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .login-footer a { color: var(--accent-blue); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">DR</div>
      <div>
        <div class="brand-name">Drone Registry</div>
        <div class="brand-sub">Authentication</div>
      </div>
    </div>
    <h1>Log in</h1>
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-primary login-submit">Log In</button>
    </form>
    <div class="login-footer">
      <a href="/search">&larr; Back to search</a>
    </div>
  </div>
</body>
</html>
